    <!-- Structured Data: FAQPage (GEO/SGO — AI engines pull these answers) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Datacendia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Datacendia is an AI decision intelligence platform. You ask it a question — about a hire, a deal, a policy change, a risk — and a panel of domain-expert AI agents (CFO, CISO, Legal, Ethics, Red Team) debates it from every angle. Every argument, every dissent, every vote is permanently recorded and cryptographically signed with Ed25519 signatures, Merkle tree hashing, and RFC 3161 timestamps. The output is a court-admissible decision record, not a chat log."
          }
        },
        {
          "@type": "Question",
          "name": "How is Datacendia different from ChatGPT?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ChatGPT is a conversation — one model, one perspective, no record. Datacendia is a governed decision. Multiple domain-expert AI agents argue from different perspectives. Disagreements are recorded as first-class artifacts. Every response is cryptographically signed (Ed25519), hashed into a Merkle tree, and RFC 3161-timestamped. The output is a court-admissible evidence bundle with full chain of custody, not a chat log that disappears."
          }
        },
        {
          "@type": "Question",
          "name": "Is my data safe with Datacendia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Datacendia Core is cloud-hosted with all data encrypted at rest and in transit. For organisations requiring full data sovereignty, the Datacendia Sovereign Edition can be deployed on-premises or in air-gapped environments — your infrastructure, your keys, your control."
          }
        },
        {
          "@type": "Question",
          "name": "What compliance frameworks does Datacendia support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Datacendia maps to EU AI Act (Article 14 human oversight, aligned), NIST AI RMF (aligned), ISO 42001 (mapped, certification pending), GDPR Article 22 (automated decision-making), HIPAA, SR 11-7 (model risk management), and ABA Formal Opinion 512 (lawyers using AI). SOC 2 Type II and ISO 27001 certifications are on our roadmap."
          }
        },
        {
          "@type": "Question",
          "name": "What LLMs does Datacendia support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Datacendia Core uses cloud LLMs via OpenAI-compatible APIs (GPT-4o, Groq, Together AI). The Sovereign Edition additionally supports local models via Ollama (Llama 3, Mistral, Phi-3, Gemma) and NVIDIA Triton/NIM for enterprise GPU inference. You can mix and match models per agent."
          }
        },
        {
          "@type": "Question",
          "name": "Is Datacendia open source?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Datacendia is Apache 2.0 licensed. The full platform — frontend, backend, deliberation engine, cryptographic infrastructure — is open source. Enterprise features are about support and SLAs, not locked functionality."
          }
        },
        {
          "@type": "Question",
          "name": "Can I verify Datacendia's cryptographic signatures myself?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Every decision packet includes Ed25519 signatures and RFC 3161 timestamps that you can verify with standard openssl commands. No proprietary tools needed. No vendor dependency. The Regulator's Receipt includes step-by-step verification instructions."
          }
        },
        {
          "@type": "Question",
          "name": "What is the Regulator's Receipt?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Regulator's Receipt™ is Datacendia's one-click court-admissible evidence export. It packages the complete decision record — all agent arguments, votes, dissent, Merkle proofs, Ed25519 signatures, RFC 3161 timestamps, and chain of custody — into a single verifiable bundle. Auditors and regulators can independently verify every claim using standard openssl commands."
          }
        }
      ]
    }
    </script>
