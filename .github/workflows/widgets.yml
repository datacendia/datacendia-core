# =============================================================================
# @DATACENDIA/WIDGETS — CI PIPELINE
# Build, type-check, and test the Web Components package on every push/PR
# =============================================================================

name: Widgets

on:
  push:
    branches: [master, develop]
    paths:
      - 'packages/widgets/**'
  pull_request:
    branches: [master, develop]
    paths:
      - 'packages/widgets/**'

concurrency:
  group: widgets-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ===========================================================================
  # BUILD + TEST
  # ===========================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: packages/widgets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/widgets/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify dist output
        run: |
          test -f dist/index.js || (echo "❌ dist/index.js missing" && exit 1)
          test -f dist/index.d.ts || (echo "❌ dist/index.d.ts missing" && exit 1)
          test -f dist/components/dcii-evidence-viewer.js || (echo "❌ evidence-viewer missing" && exit 1)
          test -f dist/components/cendia-pii-scanner.js || (echo "❌ pii-scanner missing" && exit 1)
          test -f dist/components/council-status-badge.js || (echo "❌ council-badge missing" && exit 1)
          test -f dist/react.js || (echo "❌ react wrapper missing" && exit 1)
          echo "✅ All dist artifacts verified"

      - name: Package dry-run
        run: npm pack --dry-run
